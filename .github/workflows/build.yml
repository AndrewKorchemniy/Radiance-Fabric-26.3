name: Build

on:
  push:
  pull_request:

jobs:
  compile:
    # Compiles the Java side against Minecraft 26.3. Packaging a jar also needs the native
    # renderer (MCVR), which is not ported yet; the release workflow comes with it (PORTING.md, M7).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile
        run: ./gradlew --no-daemon compileJava
