import java.util.Locale
import java.util.zip.ZipFile

plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

def profilerEnabled = providers.gradleProperty("radianceProfiler")
    .map { it.toBoolean() }
    .getOrElse(false)
def profilerSuffix = profilerEnabled ? "-profile" : ""
def operatingSystemName = System.getProperty("os.name").toLowerCase(Locale.ROOT)
def systemClassifier
if (operatingSystemName.contains("windows")) {
    systemClassifier = "windows"
} else if (operatingSystemName.contains("linux")) {
    systemClassifier = "linux"
} else {
    throw new GradleException("Unsupported operating system: ${System.getProperty('os.name')}")
}
def artifactBaseName = "${project.archives_base_name}-${project.version}${profilerSuffix}-fabric-${project.minecraft_version}-${systemClassifier}"
def nativeLibraryName = systemClassifier == "windows" ? "core.dll" : "libcore.so"
def nativeLibraryFile = file("src/main/resources/${nativeLibraryName}")
def nativeProfilerMarkers = [
    "Java_com_radiance_client_profiler_Profiler_nativeIsAvailable",
    "mcvr-profiler-jsonl",
    "texture_upload.frame.main_bytes"
]
// The 26.3 native library attaches to vanilla's Vulkan device. A library built for the 1.21.4
// interface (its own device, or the OpenGL UI bridge) lacks this entry point and must not be packaged.
def nativeInterfaceMarker = "Java_com_radiance_client_proxy_vulkan_RendererProxy_initRendererWithVulkanDevice"
def generatedProfilerSourceDir = layout.buildDirectory.dir("generated/sources/profiler/java")

tasks.register("generateProfilerBuildConfig") {
    inputs.property "radianceProfiler", profilerEnabled
    outputs.dir(generatedProfilerSourceDir)
    doLast {
        def packageDir = generatedProfilerSourceDir.get().dir("com/radiance/client/profiler").asFile
        packageDir.mkdirs()
        new File(packageDir, "ProfilerBuildConfig.java").text =
            "package com.radiance.client.profiler;\n\n" +
            "public final class ProfilerBuildConfig {\n" +
            "    public static final boolean ENABLED = ${profilerEnabled};\n\n" +
            "    private ProfilerBuildConfig() {\n" +
            "    }\n" +
            "}\n"
    }
}

sourceSets {
    main {
        java {
            srcDir(generatedProfilerSourceDir)
        }
        resources {
            exclude "**/*.zip.txt"
        }
    }
}

compileJava {
    dependsOn tasks.named("generateProfilerBuildConfig")
    options.compilerArgs += ['-h', "${projectDir}/src/main/native/include"]
    outputs.upToDateWhen { false }
}

tasks.register("verifyNativeLibrary") {
    inputs.file(nativeLibraryFile)
    doLast {
        if (!nativeLibraryFile.isFile()) {
            throw new GradleException("Native library is not installed: ${nativeLibraryFile}")
        }
        def nativeContents = new String(nativeLibraryFile.bytes,
            java.nio.charset.StandardCharsets.ISO_8859_1)
        if (!nativeContents.contains(nativeInterfaceMarker)) {
            throw new GradleException(
                "Native library was not built for the 26.3 interface (missing ${nativeInterfaceMarker})")
        }
        def profilerMarkers = nativeProfilerMarkers.collect { nativeContents.contains(it) }
        def nativeProfilerEnabled = profilerMarkers.every { it }
        if ((!nativeProfilerEnabled && profilerMarkers.any { it })
            || nativeProfilerEnabled != profilerEnabled) {
            throw new GradleException(
                "Profiler variant mismatch: Java=${profilerEnabled}, Native=${nativeProfilerEnabled}"
            )
        }
    }
}

loom {
    accessWidenerPath = file("src/main/resources/radiance.accesswidener")
    runs {
        client {
            // -PradianceRunDir=<dir> keeps separate game directories for parallel test runs.
            runDir project.findProperty("radianceRunDir") ?: "run"
        }
        // Applies every mixin and exits, without the native renderer: ./gradlew runAuditMixins
        auditMixins {
            client()
            runDir "run"
            vmArg "-Dradiance.mixinAudit=true"
        }
    }
}

tasks.named("runClient", JavaExec) {
    args "--width", "1920", "--height", "1080"
    // -PquickPlay=<world> joins that singleplayer world on startup.
    if (project.hasProperty("quickPlay")) {
        args "--quickPlaySingleplayer", project.property("quickPlay")
    }
    // -PradianceHarness=<dir> enables the file-driven test harness (see TestHarness).
    if (project.hasProperty("radianceHarness")) {
        systemProperty "radiance.harness", project.file(project.property("radianceHarness")).absolutePath
    }
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
    maven {
        name = "Mojang"
        url = "https://libraries.minecraft.net/"
    }
    maven { url = "https://api.modrinth.com/maven" }
    mavenCentral()
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Fabric Loader bundles MixinExtras, so it is no longer pulled in separately.
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Distant Horizons 3.3.4-26.3
    compileOnly "maven.modrinth:distanthorizons:TGgEbP9A"
    // Runtime-only copy so dev runs (and the mixin audit) load DH; not a published dependency.
    // Only one far terrain source feeds Vista and DH wins when both are installed, so the Voxy
    // mixins are only applied (and audited) without it: add -PradianceWithoutDistantHorizons.
    if (!project.hasProperty("radianceWithoutDistantHorizons")) {
        localRuntime "maven.modrinth:distanthorizons:TGgEbP9A"
    }

    // Voxy 0.2.20-beta (Modrinth version iIrM8ZKQ)
    compileOnly "maven.modrinth:voxy:iIrM8ZKQ"
    // Sodium 0.9.3-beta.1 (0.9.2 has identical signatures for everything Radiance touches).
    // Voxy declares a hard dependency on Sodium (0.9.2 or 0.9.3 for 26.3) and links its classes;
    // Radiance captures near terrain from Sodium's chunk builder when it is installed.
    def sodiumArtifact = "maven.modrinth:sodium:" + (project.findProperty("radianceSodiumVersion")
        ?: "mc26.3-0.9.3-beta.1-fabric")
    compileOnly sodiumArtifact
    // Runtime-only copies so dev runs (and the mixin audit) load Voxy and Sodium; not published
    // dependencies. Without Sodium, Voxy cannot load either: add -PradianceWithoutSodium to audit
    // the vanilla terrain mixins, which are not applied while Sodium is installed.
    if (!project.hasProperty("radianceWithoutSodium")) {
        localRuntime "maven.modrinth:voxy:iIrM8ZKQ"
        localRuntime sodiumArtifact
    }


    // https://mvnrepository.com/artifact/org.yaml/snakeyaml
    implementation "org.yaml:snakeyaml:2.5"
    include "org.yaml:snakeyaml:2.5"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    inputs.property "fabric_version", project.fabric_version
    inputs.property "radianceProfiler", profilerEnabled
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version,
                "fabric_version": project.fabric_version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    // Report every error instead of javac's default cap of 100 while the 26.3 port is in progress.
    it.options.compilerArgs += ['-Xmaxerrs', '10000']
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    // Compiling and running from the IDE work without the native library; packaging does not.
    dependsOn tasks.named("verifyNativeLibrary")
    archiveFileName.set("${artifactBaseName}.jar")
    if (!profilerEnabled) {
        exclude "com/radiance/client/profiler/**"
    }
    def licenceSuffix = project.base.archivesName.get()
    from("LICENCE") {
        rename { "${it}_${licenceSuffix}" }
    }
}

tasks.named("sourcesJar") {
    archiveFileName.set("${artifactBaseName}-sources.jar")
    dependsOn tasks.named("generateProfilerBuildConfig")
}

tasks.register("verifyProfilerPackaging") {
    dependsOn tasks.named("jar")
    doLast {
        def outputJar = tasks.named("jar").get().archiveFile.get().asFile
        new ZipFile(outputJar).withCloseable { zip ->
            def expectedProfilerClasses = [
                "com/radiance/client/profiler/MemoryMetricsCollector.class",
                "com/radiance/client/profiler/Profiler.class",
                "com/radiance/client/profiler/ProfilerBuildConfig.class"
            ]
            def profilerEntries = zip.entries().findAll {
                it.name.startsWith("com/radiance/client/profiler/")
            }
            if (profilerEnabled && !expectedProfilerClasses.every { zip.getEntry(it) != null }) {
                throw new GradleException("Profile JAR does not contain all profiler classes")
            }
            if (!profilerEnabled && !profilerEntries.isEmpty()) {
                throw new GradleException("Release JAR contains profiler classes")
            }
            // Look at what the bytecode actually uses. javac 25 keeps an unused constant-pool entry for
            // the class of an inlined constant (Profiler.ENABLED), so searching the raw class bytes
            // would flag every class that merely checks the flag.
            def profilerPackage = "com/radiance/client/profiler/"
            def referencedBy = zip.entries().findAll { entry ->
                if (!entry.name.endsWith(".class") || entry.name.startsWith(profilerPackage)) {
                    return false
                }
                boolean references = false
                def methodVisitor = new org.objectweb.asm.MethodVisitor(org.objectweb.asm.Opcodes.ASM9) {
                    @Override
                    void visitMethodInsn(int opcode, String owner, String name, String descriptor, boolean isInterface) {
                        references |= owner.startsWith(profilerPackage)
                    }

                    @Override
                    void visitFieldInsn(int opcode, String owner, String name, String descriptor) {
                        references |= owner.startsWith(profilerPackage)
                    }

                    @Override
                    void visitTypeInsn(int opcode, String type) {
                        references |= type.startsWith(profilerPackage)
                    }
                }
                new org.objectweb.asm.ClassReader(zip.getInputStream(entry).bytes).accept(
                    new org.objectweb.asm.ClassVisitor(org.objectweb.asm.Opcodes.ASM9) {
                        @Override
                        org.objectweb.asm.MethodVisitor visitMethod(int access, String name, String descriptor,
                            String signature, String[] exceptions) {
                            return methodVisitor
                        }
                    }, org.objectweb.asm.ClassReader.SKIP_DEBUG)
                return references
            }
            if (profilerEnabled && referencedBy.isEmpty()) {
                throw new GradleException("Profile JAR classes do not reference profiler code")
            }
            if (!profilerEnabled && !referencedBy.isEmpty()) {
                throw new GradleException("Release classes reference profiler code: ${referencedBy*.name}")
            }

            def mutableShaderSettingsEntries = zip.entries().findAll {
                it.name.endsWith(".zip.txt")
            }
            if (!mutableShaderSettingsEntries.isEmpty()) {
                throw new GradleException(
                    "JAR must not contain mutable shader settings: ${mutableShaderSettingsEntries*.name}"
                )
            }

            def nativeEntry = zip.getEntry(nativeLibraryName)
            if (nativeEntry == null) {
                throw new GradleException("JAR does not contain ${nativeLibraryName}")
            }
            def nativeContents = new String(zip.getInputStream(nativeEntry).bytes,
                java.nio.charset.StandardCharsets.ISO_8859_1)
            def nativeMarkers = nativeProfilerMarkers.collect { nativeContents.contains(it) }
            if ((profilerEnabled && !nativeMarkers.every { it })
                || (!profilerEnabled && nativeMarkers.any { it })) {
                throw new GradleException("Packaged native profiler variant does not match radianceProfiler=${profilerEnabled}")
            }
            if (!nativeContents.contains(nativeInterfaceMarker)) {
                throw new GradleException("Packaged native library was not built for the 26.3 interface")
            }
        }
    }
}

tasks.named("build") {
    dependsOn tasks.named("verifyProfilerPackaging")
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
